name: discord-adapter

on:
  push:
    paths:
      - "prt_discord.py"
      - "tests/test_prt_discord.py"
      - "pyproject.toml"
      - "docs/DISCORD_BOT.md"
      - ".github/workflows/discord-adapter.yml"
  pull_request:
    paths:
      - "prt_discord.py"
      - "tests/test_prt_discord.py"
      - "pyproject.toml"
      - "docs/DISCORD_BOT.md"
      - ".github/workflows/discord-adapter.yml"

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: Test dependency-free adapter core
        run: python -m pytest -q tests/test_prt_discord.py
      - name: Compile
        run: python -m py_compile prt_discord.py
