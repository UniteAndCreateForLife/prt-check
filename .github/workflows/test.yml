name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest -q tests

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # The installed command and the pre-commit hook run the same checks as the script.
      - run: python -m pip install . pre-commit
      - run: prt-check --version
      - run: prt-check . --fail-on warning
      - run: pre-commit try-repo . prt-check --all-files

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The action checks this repository's own workflows: none use pull_request_target.
      - uses: ./
        with:
          fail-on: warning
