[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prt-check"
dynamic = ["version"]
description = "Finds workflows hit by GitHub's 2026 pull_request_target changes: the Nov 2 default block and actions/checkout's fork refusal."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "HAL SUPREME" }]
keywords = ["github-actions", "pull_request_target", "ci", "security", "workflows"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
discord = ["discord.py==2.7.1"]

[project.urls]
Homepage = "https://github.com/UniteAndCreateForLife/prt-check"
Report = "https://github.com/UniteAndCreateForLife/prt-check/blob/main/REPORT.md"

[project.scripts]
prt-check = "prt_check:main"
prt-check-discord = "prt_discord:main"

[tool.setuptools]
py-modules = ["prt_check", "prt_discord"]

[tool.setuptools.dynamic]
version = { attr = "prt_check.__version__" }
